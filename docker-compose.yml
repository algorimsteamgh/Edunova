services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnsphere-backend
    ports:
      - "5001:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_PATH=/app/data/learnsphere.sqlite
      - JWT_SECRET=learnsphere-production-docker-compose-secret-key-2026
      - CORS_ORIGIN=*
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnsphere-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: learnsphere-network

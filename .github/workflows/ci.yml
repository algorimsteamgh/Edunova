name: Continuous Integration & Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test, Migrate & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edunova_ci
          POSTGRES_USER: edunova
          POSTGRES_PASSWORD: edunova-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edunova -d edunova_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: edunova_ci
      PGUSER: edunova
      PGPASSWORD: edunova-ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # No root package-lock.json: each package has its own
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            migration/package-lock.json

      - name: Install Dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix migration ci

      - name: Apply Database Migrations
        run: npm --prefix backend run migrate

      - name: Seed Baseline Synthetic Data
        run: npm --prefix backend run seed

      - name: Run PostgreSQL Relational Integrity Checks
        run: npm --prefix backend run db:integrity

      - name: Run Backend Automated Tests (Vitest)
        run: npm --prefix backend test

      - name: Run Migration Pipeline Tests
        run: npm --prefix migration test

      - name: Build React Production Frontend (Vite)
        run: npm --prefix frontend run build

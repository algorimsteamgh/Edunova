<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" width="280" height="54" fill="none">
  <defs>
    <linearGradient id="fullGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fullGradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="novaTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="fullIconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(4, 4)">
    <!-- Squircle container -->
    <rect width="46" height="46" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Mini emblem scaled inside (46x46 viewBox 0 0 48 48) -->
    <g transform="scale(0.85) translate(3.5, 3.5)">
      <!-- Cap Top -->
      <path d="M24 6 L41 15 L24 24 L7 15 Z" fill="url(#fullGradPrimary)" filter="url(#fullIconShadow)" />
      <path d="M39 18.5 L42 20.5 L42 28 L40 29 L40 21 Z" fill="#06b6d4" opacity="0.95" />
      <!-- Cap Underlayer -->
      <path d="M14 19.5 L14 26 C14 30.5 34 30.5 34 26 L34 19.5 L24 25 Z" fill="url(#fullGradSecondary)" opacity="0.85" />
      <!-- Open Book Leaves -->
      <path d="M24 28 C19 28 13 26 7 29.5 L7 40 C13 36.5 19 38.5 24 41 Z" fill="url(#fullGradSecondary)" />
      <path d="M24 28 C29 28 35 26 41 29.5 L41 40 C35 36.5 29 38.5 24 41 Z" fill="url(#fullGradPrimary)" />
      <line x1="24" y1="28" x2="24" y2="41" stroke="#111827" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="24,20 25.8,24.2 30,25.5 25.8,26.8 24,31 22.2,26.8 18,25.5 22.2,24.2" fill="#ffffff" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(62, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#f9fafb">
      Edu<tspan fill="url(#novaTextGrad)">nova</tspan>
    </text>

    <!-- Subtitle / Corporate Suffix -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.22em" fill="#9ca3af">
      TECHNOLOGIES
    </text>
  </g>
</svg>

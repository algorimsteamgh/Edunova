<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="eduPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="eduSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="eduGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle container -->
  <rect width="48" height="48" rx="12" fill="#0b0f19" />
  <rect width="46" height="46" x="1" y="1" rx="11" stroke="url(#eduPrimary)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Graduation Cap / Nova Beacon Top Crest -->
  <path d="M24 7 L39 15 L24 23 L9 15 Z" fill="url(#eduPrimary)" filter="url(#shadow)" />
  <path d="M38 18.5 L41 20 L41 27 L39 28 L39 20 Z" fill="#06b6d4" opacity="0.9" />

  <!-- Graduation Cap Underlayer -->
  <path d="M15 19.5 L15 25.5 C15 29.5 33 29.5 33 25.5 L33 19.5 L24 24.5 Z" fill="url(#eduSecondary)" opacity="0.8" />

  <!-- Open Book of Knowledge Base Leaves -->
  <path d="M24 28 C20 28 14 26 8 29 L8 39 C14 36 20 38 24 40 Z" fill="url(#eduSecondary)" />
  <path d="M24 28 C28 28 34 26 40 29 L40 39 C34 36 28 38 24 40 Z" fill="url(#eduPrimary)" />

  <!-- Spine Divider & Central Innovation Diamond Star -->
  <line x1="24" y1="28" x2="24" y2="40" stroke="#0b0f19" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="24,20 25.8,24 29.8,25.5 25.8,27 24,31 22.2,27 18.2,25.5 22.2,24" fill="#ffffff" />
</svg>
